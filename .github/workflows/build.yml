name: Build and Deploy RhenoCalc

on:
  push:
    branches: [ "main", "pipeline" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: Package on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          # Changed to 22.04 for maximum backward compatibility
          - os: ubuntu-22.04
            qt-arch: gcc_64
          - os: windows-latest
            qt-arch: win64_msvc2022
          - os: macos-latest
            qt-arch: clang_64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # --- INSTALL DEPENDENCIES ---
      - name: Install Linux Dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          # Install complete set of XCB dependencies including shape and xfixes
          sudo apt-get install -y build-essential libgl1-mesa-dev libxcb-xinerama0-dev \
          libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 \
          libxcb-shape0 libxcb-xfixes0 file wget

      - name: Set up MSVC (Windows)
        if: matrix.os == 'windows-latest'
        uses: ilammy/msvc-dev-cmd@v1

      # --- QT INSTALLATION VIA AQTINSTALL ---
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Install aqtinstall
        run: |
          pip install aqtinstall

      - name: Install Qt (Linux)
        if: matrix.os == 'ubuntu-22.04'
        run: |
          mkdir -p ${{ github.workspace }}/qt
          cd ${{ github.workspace }}/qt
          aqt install-qt linux desktop 6.9.3 linux_gcc_64
          # Set the correct path since aqt names the folder 'gcc_64'
          echo "QT_DIR=${{ github.workspace }}/qt/6.9.3/gcc_64" >> $GITHUB_ENV
          echo "${{ github.workspace }}/qt/6.9.3/gcc_64/bin" >> $GITHUB_PATH

      - name: Install Qt (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          mkdir -p ${{ github.workspace }}/qt
          cd ${{ github.workspace }}/qt
          aqt install-qt windows desktop 6.9.3 win64_msvc2022_64
          # Set paths (aqt typically creates the folder name as msvc2022_64)
          echo "QT_DIR=${{ github.workspace }}/qt/6.9.3/msvc2022_64" >> $env:GITHUB_ENV
          echo "${{ github.workspace }}/qt/6.9.3/msvc2022_64/bin" >> $env:GITHUB_PATH

      - name: Install Qt (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          mkdir -p ${{ github.workspace }}/qt
          cd ${{ github.workspace }}/qt
          aqt install-qt mac desktop 6.9.3 clang_64
          echo "QT_DIR=${{ github.workspace }}/qt/6.9.3/macos" >> $GITHUB_ENV
          echo "${{ github.workspace }}/qt/6.9.3/macos/bin" >> $GITHUB_PATH

      # --- BUILD PROCESS (CMake) ---
      - name: Configure CMake
        run: |
          # Pass the Qt installation directory directly to CMake
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="${{ env.QT_DIR }}"

      - name: Build Project
        run: |
          cmake --build build --config Release

      # --- DEPLOYMENT PHASE PER OPERATING SYSTEM ---

      # --- WINDOWS DEPLOYMENT ---
      - name: Windows Deployment
        if: matrix.os == 'windows-latest'
        run: |
          cd build/Release
          windeployqt --qmldir ../../ RhenoCalc.exe
          Compress-Archive -Path * -DestinationPath ../../RhenoCalc-Windows.zip

      # --- MACOS DEPLOYMENT ---
      - name: macOS Deployment
        if: matrix.os == 'macos-latest'
        run: |
          macdeployqt build/RhenoCalc.app -dmg
          mv build/RhenoCalc.dmg ./RhenoCalc-macOS.dmg

      # --- LINUX DEPLOYMENT ---
      - name: Linux Deployment
        if: matrix.os == 'ubuntu-22.04'
        run: |
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          wget -q https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x linuxdeploy-x86_64.AppImage linuxdeploy-plugin-qt-x86_64.AppImage
          
          export PATH="$QT_DIR/bin:$PATH"
          
          mkdir -p AppDir/usr/bin
          cp build/RhenoCalc AppDir/usr/bin/
          
          echo -e "[Desktop Entry]\nType=Application\nName=RhenoCalc\nExec=RhenoCalc\nIcon=RhenoCalc\nCategories=Utility;" > AppDir/RhenoCalc.desktop
          touch AppDir/RhenoCalc.png
          
          ./linuxdeploy-x86_64.AppImage --appdir AppDir --plugin qt --output appimage
          mv RhenoCalc-x86_64.AppImage RhenoCalc-Linux.AppImage

      # --- UPLOAD ARTIFACTS ---
      - name: Upload Finished Packages
        uses: actions/upload-artifact@v7
        with:
          name: RhenoCalc-${{ matrix.os }}-package
          path: |
            RhenoCalc-Windows.zip
            RhenoCalc-macOS.dmg
            RhenoCalc-Linux.AppImage